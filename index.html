<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROKET V — YOLCULUK</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height:100%; background:#000; overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; color:#fff; }
  canvas { display:block; }
  .hud { position:fixed; top:8px; z-index:10; height:34px; padding:0 12px;
    background:rgba(255,255,255,0.06); color:#fff;
    border:1px solid rgba(255,255,255,0.25); border-radius:9px;
    font-family:inherit; font-size:12px; letter-spacing:0.5px; cursor:pointer;
    display:flex; align-items:center; -webkit-tap-highlight-color:transparent; }
  .hud:active { background:rgba(255,255,255,0.18); }
  #btnYeni { right:calc(50% + 5px); }
  #btnTam  { left:calc(50% + 5px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btnYeni" class="hud">&#8635; BA&#350;TAN</button>
<button id="btnTam" class="hud">&#9214; TAM EKRAN</button>
<script>
"use strict";

/* ===================== EKRAN ===================== */
const W = 1200, H = 800;
const SURUM = "v2.2";
document.title = `ROKET ${SURUM} — YOLCULUK`;
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
let scale = 1, offX = 0, offY = 0;
const AYAK_BOY = 24;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  const cw = W*scale, ch = H*scale;
  cvs.style.width = cw+"px"; cvs.style.height = ch+"px";
  cvs.width = Math.round(cw*dpr); cvs.height = Math.round(ch*dpr);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, 0, 0);
  offX = (innerWidth-cw)/2; offY = (innerHeight-ch)/2;
}
addEventListener("resize", resize);
const yerel = (cx, cy) => ({ x:(cx-offX)/scale, y:(cy-offY)/scale });

/* ===================== YUKSELTMELER ===================== */
const TEMEL = { yakit:110, itki:230, donme:3.0, inHiz:62, inAci:0.60, tuketim:26 };
const GRAV = 5600;

const YUKSELTMELER = [
  { id:"tank",  ad:"YAKIT TANKI",  aciklama:"+35 kapasite",                  max:10, fiyat:l=>150+l*95 },
  { id:"itki",  ad:"MOTOR",        aciklama:"+14% itki, +20% yakit tuketimi",max:5, fiyat:l=>170+l*115 },
  { id:"jiro",  ad:"JIROSKOP",     aciklama:"+14% donus hizi",               max:5, fiyat:l=>130+l*80 },
  { id:"ayak",  ad:"INIS TAKIMI",  aciklama:"Daha toleransli inis",          max:5, fiyat:l=>180+l*120 },
  { id:"fuze",  ad:"FUZE RAMPASI", aciklama:"+2 fuze kapasitesi, dolu gelir",max:5, fiyat:l=>260+l*170 },
  { id:"kalkan",ad:"KALKAN",       aciklama:"Her sicrama +1 yuk; carpmayi emer",max:5, fiyat:l=>220+l*150 }
];
let seviye = { tank:0, itki:0, jiro:0, ayak:0, fuze:0, kalkan:0 };

const kapasite  = () => TEMEL.yakit + seviye.tank*35;
const itkiGucu  = () => TEMEL.itki * (1 + 0.14*seviye.itki);
const tuketim   = () => TEMEL.tuketim * (1 + 0.20*seviye.itki);
const donusHizi = () => TEMEL.donme * (1 + 0.14*seviye.jiro);
const inisHizi  = () => TEMEL.inHiz + seviye.ayak*12;
const inisAcisi = () => TEMEL.inAci + seviye.ayak*0.09;
const fuzeKap   = () => seviye.fuze*2;
const kalkanKap = () => seviye.kalkan;
const yikimEsigi   = () => 52 + seviye.fuze*14;
const bolunmeEsigi = () => 78 + seviye.fuze*16;
const kraterR      = () => 24 + seviye.fuze*10;

const SARFLAR = [
  { ad:"YAKIT IKMALI", aciklama:"+35 yakit", fiyat:()=>70,
    uygun:()=> yakit < kapasite()-1, uygula:()=>{ yakit = Math.min(kapasite(), yakit+35); } },
  { ad:"FUZE IKMALI",  aciklama:"+1 fuze",   fiyat:()=>90,
    uygun:()=> seviye.fuze>0 && fuzeSayi<fuzeKap(), uygula:()=>{ fuzeSayi = Math.min(fuzeKap(), fuzeSayi+1); } },
  { ad:"UYDU", aciklama:"+1 kontrol noktasi; ucarken birak, olursen oradan basla", fiyat:()=>130,
    uygun:()=> uyduSayi < 5, uygula:()=>{ uyduSayi++; } }
];

/* ===================== DUNYA ===================== */
let gezegenler = [], taslar = [], parcalar = [], iz = [], fuzeler = [];
let karaDelikler = [], kapsuller = [], gidenMekikler = [];
let ufo = null, ufoTimer = -1, dusmanFuzeler = [];   // 20. etap sonrasi dusman UFO
let bildirim = null;
let roket, yakit = 0, fuzeSayi = 0, kalkan = 0, para = 0;
let etap = 1, durum = "hazir", mesaj = null, sure = 0, toplamDeneme = 0;
let atisSayac = 0, sarsinti = 0, dukkanSecim = 0, sonKazanc = null;
let kolBagli = false, sonrakiId = 1, yon = -0.35, bedavaIkmal = false;
let kayit = null;   // etap basi anlik goruntu
let uyduSayi = 0, uyduKayit = null, uyduKonum = null;   // kontrol noktasi (uydu)
const kam = { x:0, y:0, s:1, hx:0, hy:0, hs:1, ilk:true };

const basGez = () => gezegenler.find(g => g.baslangic);
const hedefGez = () => gezegenler.find(g => g.hedef);

function gezegenYap(x, y, r, m) {
  return { id:sonrakiId++, x, y, r, m, vx:0, vy:0, kraterler:[],
           hedef:false, baslangic:false, kurtarma:false, mekik:null, faz:Math.random()*6.28 };
}

// UFO atis sayisi bloga gore kademeli: 16-20 -> 3, 21-25 -> 4, 26+ -> 5 (once yok)
const ufoAtisSayisi = () => etap < 16 ? 0 : (etap < 21 ? 3 : (etap < 26 ? 4 : 5));
function blokAdi() {
  if (etap <= 5)  return "TEMELLER";
  if (etap <= 10) return "KURTARMA";
  if (etap <= 15) return "USTALIK";
  if (etap <= 20) return "TEHLIKE BOLGESI";
  return "SONSUZ";
}

/* Verilen dogrultuda, mevcut gezegen ve kara deliklerden yeterince uzak bir yer
   bulmaya calisir. Bulamazsa null doner (o nesne o sicramada atlanir). */
function yerAra(bazX, bazY, dik, sapMin, sapGen, r, boslukGez, boslukKara) {
  for (let i = 0; i < 12; i++) {
    const sap = (Math.random() < 0.5 ? -1 : 1) * (sapMin + Math.random()*sapGen);
    const x = bazX + Math.cos(dik)*sap, y = bazY + Math.sin(dik)*sap;
    let ok = true;
    for (const g of gezegenler) if (Math.hypot(g.x-x, g.y-y) < g.r + r + boslukGez) { ok = false; break; }
    if (ok) for (const k of karaDelikler) if (Math.hypot(k.x-x, k.y-y) < k.r + r + boslukKara) { ok = false; break; }
    if (ok) return { x, y };
  }
  return null;
}

function hedefUret() {
  const b = basGez();
  yon += (Math.random()-0.5) * 1.5;
  const mesafe = 470 + Math.min(etap*26, 260) + b.r;
  const hx = b.x + Math.cos(yon)*mesafe;
  const hy = b.y + Math.sin(yon)*mesafe;
  const r = 68 + Math.random()*40;
  const h = gezegenYap(hx, hy, r, 1.0 + Math.random()*0.9);
  h.hedef = true;
  gezegenler.push(h);

  // ara kutle (yercekimi) — Blok 2'den itibaren (6+), sonraki bloklarda daha sik
  if (etap >= 6 && Math.random() < (etap >= 11 ? 0.6 : 0.4)) {
    const t = 0.42 + Math.random()*0.16;
    const px = b.x + (hx-b.x)*t, py = b.y + (hy-b.y)*t;
    const r = 62 + Math.random()*30;
    const yer = yerAra(px, py, yon + Math.PI/2, 110, 90, r, 45, 85);
    if (yer) gezegenler.push(gezegenYap(yer.x, yer.y, r, 1.6 + Math.random()*0.8));
  }

  // kurtarma gezegeni: mahsur mekik — Blok 2 (6-10) temasi, sonra ara ara devam
  if (etap >= 6 && Math.random() < (etap <= 10 ? 0.6 : 0.35)) {
    const t = 0.40 + Math.random()*0.20;
    const px = b.x + (hx-b.x)*t, py = b.y + (hy-b.y)*t;
    const r = 58 + Math.random()*20;
    const yer = yerAra(px, py, yon + Math.PI/2, 150, 95, r, 45, 85);
    if (yer) {
      const kp = gezegenYap(yer.x, yer.y, r, 1.0 + Math.random()*0.5);
      kp.kurtarma = true;
      kp.mekik = { yakit:0, kap:40, gitti:false, aci:Math.random()*6.2832 };
      gezegenler.push(kp);
    }
  }

  // goktaslari — blok egrisi boyunca yumusakca artar (1-2 -> 4-5)
  const adet = Math.min(1 + Math.floor((etap-1)/4), 5);
  for (let i = 0; i < adet; i++) {
    const t = 0.25 + Math.random()*0.5;
    const px = b.x + (hx-b.x)*t, py = b.y + (hy-b.y)*t;
    const dik = yon + Math.PI/2, sap = (Math.random()-0.5)*300;
    const hiz = 55 + Math.random()*55 + etap*3;
    const ha = Math.random()*6.28;
    taslar.push({ x:px + Math.cos(dik)*sap, y:py + Math.sin(dik)*sap,
      vx:Math.cos(ha)*hiz, vy:Math.sin(ha)*hiz,
      r:18 + Math.random()*13, faz:Math.random()*6.28, canli:true, merkezX:px, merkezY:py });
  }

  // kara delik — Blok 4 (16-20) "tehlike bolgesi" temasi, sonra da devam
  // en son uretilir; tum gezegenlerden acikca uzak bir yere konur (yoksa atlanir)
  if (etap >= 16 && Math.random() < 0.5) {
    const t = 0.40 + Math.random()*0.22;
    const px = b.x + (hx-b.x)*t, py = b.y + (hy-b.y)*t;
    const r = 27 + Math.random()*9;
    const yer = yerAra(px, py, yon + Math.PI/2, 135, 95, r, 65, 130);
    if (yer) karaDelikler.push({ x:yer.x, y:yer.y,
      r, etkiR:360, m:9 + Math.random()*4, faz:Math.random()*6.28 });
  }

  // toplanabilir kapsuller (yakit / kredi)
  const kapAdet = 1 + Math.floor(Math.random()*2);
  for (let i = 0; i < kapAdet; i++) {
    const t = 0.3 + Math.random()*0.45;
    const px = b.x + (hx-b.x)*t, py = b.y + (hy-b.y)*t;
    const dik = yon + Math.PI/2, sap = (Math.random()-0.5)*360;
    kapsuller.push({ x:px + Math.cos(dik)*sap, y:py + Math.sin(dik)*sap,
      r:13, tur: Math.random() < 0.5 ? "yakit" : "kredi", faz:Math.random()*6.28, canli:true });
  }
}

function temizle() {
  const b = basGez();
  if (!b) return;
  // yeni hedef henuz uretilmedi: mesafeyi kalkis gezegenine gore olc
  gezegenler = gezegenler.filter(g => g.baslangic || Math.hypot(g.x-b.x, g.y-b.y) < 1500);
  if (gezegenler.length > 6) {
    const uzak = gezegenler.filter(g => !g.baslangic)
      .sort((a,c) => Math.hypot(c.x-b.x, c.y-b.y) - Math.hypot(a.x-b.x, a.y-b.y));
    const sil = new Set(uzak.slice(0, gezegenler.length-6).map(g => g.id));
    gezegenler = gezegenler.filter(g => !sil.has(g.id));
  }
  taslar = taslar.filter(t => t.canli && Math.hypot(t.x-b.x, t.y-b.y) < 1700);
  karaDelikler = karaDelikler.filter(k => Math.hypot(k.x-b.x, k.y-b.y) < 1900);
  kapsuller = kapsuller.filter(k => k.canli && Math.hypot(k.x-b.x, k.y-b.y) < 1900);
}

function gezKopya(g) { return { ...g, kraterler: g.kraterler.map(k => ({...k})), mekik: g.mekik ? {...g.mekik} : null }; }
function anlikGoruntu() {
  return {
    gezegenler: gezegenler.map(gezKopya),
    taslar: taslar.map(t => ({ ...t })),
    karaDelikler: karaDelikler.map(k => ({ ...k })),
    kapsuller: kapsuller.map(k => ({ ...k })),
    roket: { ...roket }, yakit, fuzeSayi, kalkan, para, yon, sure
  };
}
function anlikKaydet() { kayit = anlikGoruntu(); }
function anlikGeriYukle(k, uyduMu) {
  gezegenler = k.gezegenler.map(gezKopya);
  taslar = k.taslar.map(t => ({ ...t }));
  karaDelikler = k.karaDelikler.map(c => ({ ...c }));
  kapsuller = k.kapsuller.map(c => ({ ...c }));
  roket = { ...k.roket };
  yakit = k.yakit; fuzeSayi = k.fuzeSayi; kalkan = k.kalkan; para = k.para; yon = k.yon;
  parcalar = []; iz = []; fuzeler = []; gidenMekikler = []; bildirim = null;
  ufo = null; dusmanFuzeler = [];
  ufoTimer = etap >= 16 ? 2.5 + Math.random()*4.5 : -1;   // dirilince UFO yeniden gelir
  atisSayac = 0; sarsinti = 0; mesaj = null;
  if (uyduMu) {   // uydudan diril: yerinde, durgun, hemen kontrol sende
    roket.vx = roket.vy = 0; roket.canli = true; durum = "ucus"; sure = k.sure;
  } else { sure = 0; durum = "hazir"; }
}
function anlikYukle() { anlikGeriYukle(kayit, false); }
function diril() {   // olunce cagirilir — uydu varsa oradan, yoksa etap basindan
  toplamDeneme++;
  if (uyduKayit) anlikGeriYukle(uyduKayit, true);
  else anlikYukle();
}
function uyduBirak() {   // ucarken kontrol noktasi birak (sarf malzeme)
  if (durum !== "ucus" || !roket.canli || uyduSayi <= 0) return;
  uyduSayi--;
  uyduKayit = anlikGoruntu();
  uyduKonum = { x: roket.x, y: roket.y };
  patlamaEfekti(roket.x, roket.y, 20, "#8ad4ff", 120);
  sarsinti = Math.max(sarsinti, 4);
}

function etapBaslat() {
  bedavaIkmal = false;
  if (yakit < 45) { yakit = 45; bedavaIkmal = true; }
  kalkan = kalkanKap();   // kalkan yukleri her sicramada tazelenir
  uyduKayit = null; uyduKonum = null;   // yeni sicrama: eski uydu geride kalir
  temizle();
  hedefUret();
  anlikKaydet();
  sure = 0; durum = "hazir"; mesaj = null;
  parcalar = []; iz = []; fuzeler = []; gidenMekikler = []; bildirim = null;
  ufo = null; dusmanFuzeler = [];
  ufoTimer = etap >= 16 ? 2.5 + Math.random()*4.5 : -1;   // Blok 4'ten (16+) UFO gelir
}

function yenidenBasla() {
  seviye = { tank:0, itki:0, jiro:0, ayak:0, fuze:0, kalkan:0 };
  para = 0; etap = 1; toplamDeneme = 0; sonKazanc = null;
  yakit = kapasite(); fuzeSayi = 0; kalkan = 0; yon = -0.35;
  uyduSayi = 0; uyduKayit = null; uyduKonum = null;
  ufo = null; ufoTimer = -1; dusmanFuzeler = [];
  sonrakiId = 1; gezegenler = []; taslar = []; karaDelikler = []; kapsuller = []; gidenMekikler = []; bildirim = null;

  const ilk = gezegenYap(0, 0, 92, 1.2);
  ilk.baslangic = true;
  gezegenler.push(ilk);
  roket = { x:0, y:-(92+AYAK_BOY), vx:0, vy:0, aci:0, itki:false, canli:true, ayak:1 };
  kam.ilk = true;
  etapBaslat();
}

/* ===================== KAMERA ===================== */
function kameraGuncelle(dt) {
  const b = basGez(), h = hedefGez();
  const nk = [roket];
  if (b) nk.push(b); if (h) nk.push(h);
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const o of nk) {
    const r = o.r || 30;
    x1 = Math.min(x1, o.x-r); x2 = Math.max(x2, o.x+r);
    y1 = Math.min(y1, o.y-r); y2 = Math.max(y2, o.y+r);
  }
  const pad = 190;
  const gw = (x2-x1) + pad*2, gh = (y2-y1) + pad*2;
  kam.hs = Math.max(0.42, Math.min(1.05, Math.min(W/gw, H/gh)));
  kam.hx = (x1+x2)/2; kam.hy = (y1+y2)/2;
  if (kam.ilk) { kam.x = kam.hx; kam.y = kam.hy; kam.s = kam.hs; kam.ilk = false; }
  else {
    const k = Math.min(1, dt*3.2);
    kam.x += (kam.hx-kam.x)*k; kam.y += (kam.hy-kam.y)*k; kam.s += (kam.hs-kam.s)*k;
  }
}
function dunyaBasla() {
  ctx.save();
  if (sarsinti > 0) ctx.translate((Math.random()-0.5)*sarsinti, (Math.random()-0.5)*sarsinti);
  ctx.translate(W/2, H/2); ctx.scale(kam.s, kam.s); ctx.translate(-kam.x, -kam.y);
}
const dunyaBitir = () => ctx.restore();

/* ===================== EKRAN TUSLARI ===================== */
// Sag kume (Mobile Legends tarzi): buyuk gaz + etrafinda fuze/uydu. Donus artik soldaki joystick.
const TUSLAR = [
  { id:"uydu", x:W-140, y:H-270, r:42, etiket:"UYDU", tus:"C" },
  { id:"ates", x:W-260, y:H-175, r:50, etiket:"FUZE", tus:"X" },
  { id:"itki", x:W-125, y:H-120, r:76, etiket:"\u25B2",    tus:"W" }
];
// Soldaki analog joystick (donus)
const JX = 155, JY = H-135, JR = 78, JKNOB = 34;
let joyId = null, joyPos = { x:JX, y:JY };
function joyGuncelle(l) {
  let dx = l.x-JX, dy = l.y-JY; const d = Math.hypot(dx, dy);
  if (d > JR) { dx = dx/d*JR; dy = dy/d*JR; }
  joyPos = { x:JX+dx, y:JY+dy };
}
const joyBolgesinde = l => Math.hypot(l.x-JX, l.y-JY) < JR*1.9;

/* ===================== GIRDI ===================== */
const kb = { sol:false, sag:false, itki:false, ates:false };
const isaretler = new Map();
const girdi = { sol:false, sag:false, itki:false, ates:false };
const SOL_T=["ArrowLeft","a","A"], SAG_T=["ArrowRight","d","D"],
      ITKI_T=["ArrowUp","w","W"], ATES_T=["x","X"];
const satirSayisi = () => YUKSELTMELER.length + SARFLAR.length + 1;

addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  if (SOL_T.includes(e.key)) kb.sol = true;
  if (SAG_T.includes(e.key)) kb.sag = true;
  if (ITKI_T.includes(e.key) || e.code === "Space") kb.itki = true;
  if (ATES_T.includes(e.key)) kb.ates = true;
  if ((e.key === "c" || e.key === "C") && !e.repeat) uyduBirak();
  if ((e.key === "r" || e.key === "R") && durum !== "dukkan") diril();
  if (e.key === "Enter") onayla();
  if (durum === "dukkan") {
    const n = satirSayisi();
    if (e.key === "ArrowUp")   dukkanSecim = (dukkanSecim-1+n)%n;
    if (e.key === "ArrowDown") dukkanSecim = (dukkanSecim+1)%n;
  }
});
addEventListener("keyup", e => {
  if (SOL_T.includes(e.key)) kb.sol = false;
  if (SAG_T.includes(e.key)) kb.sag = false;
  if (ITKI_T.includes(e.key) || e.code === "Space") kb.itki = false;
  if (ATES_T.includes(e.key)) kb.ates = false;
});

function tusBul(l) {
  if (kolBagli) return null;
  for (const t of TUSLAR) {
    const dx = l.x-t.x, dy = l.y-t.y;
    if (dx*dx + dy*dy < (t.r+12)*(t.r+12)) return t.id;
  }
  return null;
}
cvs.addEventListener("pointerdown", e => {
  cvs.setPointerCapture?.(e.pointerId);
  const l = yerel(e.clientX, e.clientY);
  isaretler.set(e.pointerId, l);
  if (durum === "dukkan") { dukkanDokun(l); return; }
  if (durum === "ucus") {
    if (!kolBagli && joyId === null && joyBolgesinde(l)) { joyId = e.pointerId; joyGuncelle(l); return; }
    if (!kolBagli && tusBul(l) === "uydu") { uyduBirak(); return; }
    return;
  }
  onayla();
});
cvs.addEventListener("pointermove", e => {
  if (!isaretler.has(e.pointerId)) return;
  const l = yerel(e.clientX, e.clientY);
  isaretler.set(e.pointerId, l);
  if (e.pointerId === joyId) joyGuncelle(l);
});
const birak = e => { isaretler.delete(e.pointerId); if (e.pointerId === joyId) joyId = null; };
cvs.addEventListener("pointerup", birak);
cvs.addEventListener("pointercancel", birak);
cvs.addEventListener("pointerleave", birak);

/* Tam ekran ve Bastan butonlari (tablet icin) */
document.getElementById("btnTam").addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
  } else {

document.getElementById("btnYeni").addEventListener("click", () => {
  // BASTAN: sicramanin en basina don, birakilan uyduyu da iptal et

let kolGecmis = { a:false, b:false, yukari:false, asagi:false, start:false, y:false };
function kolOku() {
  const out = { sol:false, sag:false, itki:false, ates:false };
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let bulundu = false;
  for (const g of pads) {
    if (!g) continue;
    bulundu = true;
    const ax = g.axes[0]||0, ay = g.axes[1]||0;
    if (ax < -0.28 || g.buttons[14]?.pressed) out.sol = true;
    if (ax >  0.28 || g.buttons[15]?.pressed) out.sag = true;
    const a = !!g.buttons[0]?.pressed, b = !!g.buttons[1]?.pressed;
    const y = !!g.buttons[3]?.pressed;   // Y / ucgen: uydu birak
    const rt = (g.buttons[7]?.value||0) > 0.3;
    const yukari = !!g.buttons[12]?.pressed || ay < -0.5;
    const asagi  = !!g.buttons[13]?.pressed || ay >  0.5;
    const start  = !!g.buttons[9]?.pressed;
    if (durum === "ucus") { if (a||rt) out.itki = true; if (b) out.ates = true;
      if (y && !kolGecmis.y) uyduBirak(); }
    else if (durum === "dukkan") {
      const n = satirSayisi();
      if (yukari && !kolGecmis.yukari) dukkanSecim = (dukkanSecim-1+n)%n;
      if (asagi  && !kolGecmis.asagi)  dukkanSecim = (dukkanSecim+1)%n;
      if (a && !kolGecmis.a) onayla();
      if (start && !kolGecmis.start) devamEt();
    } else if (a && !kolGecmis.a) onayla();
    kolGecmis = { a, b, yukari, asagi, start, y };
    break;
  }
  kolBagli = bulundu;
  return out;
}

/* ===================== AKIS ===================== */
function onayla() {
  if (durum === "hazir") durum = "ucus";
  else if (durum === "patladi") diril();
  else if (durum === "indi") { durum = "dukkan"; dukkanSecim = 0; }
  else if (durum === "dukkan") satirSec(dukkanSecim);
}
function devamEt() {
  // inilen gezegen yeni kalkis noktasi olur
  for (const g of gezegenler) { g.baslangic = false; g.hedef = false; }
  const yeni = gezegenler.find(g => g.id === sonInisId);
  if (yeni) yeni.baslangic = true;
  etap++;
  etapBaslat();
}
let sonInisId = null;

// Tersane satirlari: once sarf malzemeler (ikmaller ustte), sonra yukseltmeler, en altta devam
function dukkanSatirlari() {
  const r = [];
  for (let i = 0; i < SARFLAR.length; i++) r.push({ tur:"sarf", i });
  for (let i = 0; i < YUKSELTMELER.length; i++) r.push({ tur:"yuk", i });
  r.push({ tur:"devam" });
  return r;
}
function dukkanY(idx, n) {   // sarf grubu | yukseltme grubu (bosluk) | devam (bosluk)
  return 232 + idx*54 + (idx >= SARFLAR.length ? 14 : 0) + (idx === n-1 ? 14 : 0);
}
function satirSec(sel) {
  const row = dukkanSatirlari()[sel];
  if (!row) return;
  if (row.tur === "devam") { devamEt(); return; }
  if (row.tur === "yuk") {
    const u = YUKSELTMELER[row.i], lv = seviye[u.id];
    if (lv >= u.max) return;
    const f = u.fiyat(lv);
    if (para < f) return;
    para -= f; seviye[u.id] = lv+1;
    if (u.id === "fuze")   fuzeSayi = fuzeKap();
    if (u.id === "kalkan") kalkan = kalkanKap();
  } else {   // sarf
    const s = SARFLAR[row.i];
    if (!s.uygun()) return;
    const f = s.fiyat();
    if (para < f) return;
    para -= f; s.uygula();
  }
}
function dukkanDokun(l) {
  const n = satirSayisi();
  for (let i = 0; i < n; i++) {
    const y = dukkanY(i, n);
    if (l.y > y-24 && l.y < y+24 && l.x > 190 && l.x < 1010) { dukkanSecim = i; satirSec(i); return; }
  }
}

/* ===================== FUZE ===================== */
function kirintiSac(x, y, adet, hiz, boy) {
  for (let i = 0; i < adet; i++) {
    const a = Math.random()*6.2832, h = hiz*(0.5+Math.random());
    taslar.push({ x:x+Math.cos(a)*12, y:y+Math.sin(a)*12, vx:Math.cos(a)*h, vy:Math.sin(a)*h,
      r:boy*(0.7+Math.random()*0.6), faz:Math.random()*6.28, canli:true });
  }
}
function patlamaEfekti(x, y, adet, renk, guc) {
  for (let i = 0; i < adet; i++) {
    const a = Math.random()*6.2832, h = guc*(0.3+Math.random());
    parcalar.push({ x, y, vx:Math.cos(a)*h, vy:Math.sin(a)*h, omur:0.4+Math.random()*0.7, renk });

}
function kalkanKir(x, y) {   // kalkan bir carpmayi emdiginde
  sarsinti = Math.max(sarsinti, 9);

}
function fuzeCarpti(m, p) {
  const dx = m.x-p.x, dy = m.y-p.y, d = Math.max(1, Math.hypot(dx,dy));
  const nx = dx/d, ny = dy/d;
  sarsinti = Math.max(sarsinti, 11);
  if (p.baslangic) {   // kalkis gezegenini sadece cizik alir
    p.kraterler.push({ a:Math.atan2(ny,nx), r:kraterR()*0.7 });
    patlamaEfekti(m.x, m.y, 20, "#ff9a4d", 150); para += 10; return;
  }
  if (p.r < yikimEsigi()) {
    patlamaEfekti(p.x, p.y, 50, "#fff", 280);
    kirintiSac(p.x, p.y, 5, 95, p.r*0.19);
    p.yokOldu = true; para += 100;
    if (p.hedef) bitir(false, "HEDEFI YOK ETTIN");
  } else if (p.r < bolunmeEsigi()) {
    const yeniR = p.r*0.6, yeniM = p.m*0.48, tx = -ny, ty = nx, ayr = p.r*0.55;
    for (const s of [-1,1]) {
      const g = gezegenYap(p.x+tx*ayr*s, p.y+ty*ayr*s, yeniR, yeniM);
      g.vx = tx*48*s - nx*20; g.vy = ty*48*s - ny*20;
      g.kraterler = [{ a:Math.atan2(-ty*s,-tx*s), r:yeniR*0.34 }];
      g.hedef = p.hedef;
      gezegenler.push(g);
    }
    patlamaEfekti(p.x, p.y, 44, "#fff", 240);
    kirintiSac(p.x, p.y, 4, 85, p.r*0.15);
    p.yokOldu = true; para += 60;
  } else {
    p.kraterler.push({ a:Math.atan2(ny,nx), r:kraterR() });
    if (p.kraterler.length > 10) p.kraterler.shift();
    const itme = 40/p.m;
    p.vx -= nx*itme; p.vy -= ny*itme;
    p.r = Math.max(bolunmeEsigi()*0.94, p.r - kraterR()*0.15);
    p.m = Math.max(0.4, p.m - 0.06);
    patlamaEfekti(m.x, m.y, 28, "#ff9a4d", 180);
    kirintiSac(m.x, m.y, 2, 75, 12);
    para += 20;
  }
  gezegenler = gezegenler.filter(g => !g.yokOldu);
}

function mekikKurtar(p) {   // mekigin yakiti doldu: kalkip gider, bol para birakir
  p.mekik.gitti = true;
  const a = p.mekik.aci;

function ufoCagir() {   // rastgele bir kenardan girer, haritayi caprazlar, 3 fuze atar

/* ===================== FIZIK ===================== */
function guncelle(dt) {
  const pad = kolOku();
  girdi.sol  = kb.sol  || pad.sol;
  girdi.sag  = kb.sag  || pad.sag;
  girdi.itki = kb.itki || pad.itki;
  girdi.ates = kb.ates || pad.ates;

  girdi.don = (girdi.sag ? 1 : 0) - (girdi.sol ? 1 : 0) + joyX;   // klavye/kol + joystick birlesik
  girdi.don = Math.max(-1, Math.min(1, girdi.don));

        vx:-m.ax*130+(Math.random()-0.5)*60, vy:-m.ay*130+(Math.random()-0.5)*60,
        omur:0.3+Math.random()*0.2, renk:"#fff" });
  }
  gidenMekikler = gidenMekikler.filter(m => m.omur > 0);

  // UFO: zamani gelince cagir, hareket ettir, rokete 3 fuze at
  if (durum === "ucus" && ufoTimer > 0) { ufoTimer -= dt; if (ufoTimer <= 0 && !ufo) ufoCagir(); }
  if (ufo) {
    ufo.x += ufo.vx*dt; ufo.y += ufo.vy*dt; ufo.omur -= dt; ufo.faz += dt*5;
    ufo.atisSayac -= dt;
    if (ufo.atisKalan > 0 && ufo.atisSayac <= 0 && durum === "ucus" && roket.canli) {
      ufo.atisKalan--; ufo.atisSayac = 0.95;
      const dx = roket.x-ufo.x, dy = roket.y-ufo.y, d = Math.hypot(dx,dy)||1;
      dusmanFuzeler.push({ x:ufo.x, y:ufo.y, vx:(dx/d)*265, vy:(dy/d)*265, omur:5 });
      sarsinti = Math.max(sarsinti, 3);
    }
    if (ufo.omur <= 0) ufo = null;
  }
  for (const m of dusmanFuzeler) {
    m.x += m.vx*dt; m.y += m.vy*dt; m.omur -= dt;
    if (Math.random() < 0.5)
      parcalar.push({ x:m.x, y:m.y, vx:(Math.random()-0.5)*30, vy:(Math.random()-0.5)*30,
        omur:0.3+Math.random()*0.15, renk:"#ff5c8a" });
  }
  dusmanFuzeler = dusmanFuzeler.filter(m => m.omur > 0);

  for (const p of gezegenler) {
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1-0.25*dt); p.vy *= (1-0.25*dt);
  }
  for (const t of taslar) {
    if (!t.canli) continue;
    t.x += t.vx*dt; t.y += t.vy*dt;
    if (t.merkezX !== undefined) {   // uretim merkezine geri cek
      const dx = t.merkezX-t.x, dy = t.merkezY-t.y, d = Math.hypot(dx,dy);
      if (d > 320) { t.vx += (dx/d)*90*dt; t.vy += (dy/d)*90*dt; }
    }
  }
  for (const p of parcalar) { p.x += p.vx*dt; p.y += p.vy*dt; p.omur -= dt; }
  parcalar = parcalar.filter(p => p.omur > 0);

  for (const m of fuzeler) {
    for (const p of gezegenler) {
      const dx = p.x-m.x, dy = p.y-m.y, d2 = Math.max(dx*dx+dy*dy, 400);

    }

      const dx = k.x-m.x, dy = k.y-m.y, d2 = Math.max(dx*dx+dy*dy, 100);
      const d = Math.sqrt(d2), f = GRAV*k.m/d2;
      m.vx += (dx/d)*f*dt; m.vy += (dy/d)*f*dt;
      if (d < k.r) m.omur = 0;   // olay ufkuna giren fuze yutulur
    }
    m.x += m.vx*dt; m.y += m.vy*dt; m.omur -= dt;
    if (Math.random() < 0.6)
      parcalar.push({ x:m.x, y:m.y, vx:(Math.random()-0.5)*30, vy:(Math.random()-0.5)*30,
        omur:0.3+Math.random()*0.2, renk:"#ff9a4d" });
  }
  for (const m of fuzeler) {
    if (m.omur <= 0) continue;
    for (const t of taslar) {
      if (!t.canli) continue;
      const dx = t.x-m.x, dy = t.y-m.y;
      if (dx*dx+dy*dy < t.r*t.r) {
        t.canli = false; m.omur = 0; para += 25;
        patlamaEfekti(t.x, t.y, 22, "#ff5c4d", 160); break;
      }
    }
    if (m.omur <= 0) continue;
    if (ufo) {   // kendi fuzenle UFO'yu vurursan yok olur, para verir
      const dx = ufo.x-m.x, dy = ufo.y-m.y;
      if (dx*dx+dy*dy < 24*24) {
        m.omur = 0; para += 150;
        patlamaEfekti(ufo.x, ufo.y, 50, "#ff5c8a", 280);
        bildirim = { metin:"UFO VURULDU   +150 KREDI", omur:2.2 };
        sarsinti = Math.max(sarsinti, 9); ufo = null; continue;
      }
    }
    for (const p of gezegenler) {
      const dx = p.x-m.x, dy = p.y-m.y;
      if (dx*dx+dy*dy < (p.r+4)*(p.r+4)) { m.omur = 0; fuzeCarpti(m, p); break; }
    }
  }
  fuzeler = fuzeler.filter(m => m.omur > 0);
  taslar = taslar.filter(t => t.canli);

  if (durum !== "ucus" || !roket.canli) return;

  atisSayac -= dt;
  if (girdi.ates && fuzeSayi > 0 && atisSayac <= 0) {
    atisSayac = 0.5; fuzeSayi--;
    fuzeler.push({ x:roket.x + Math.sin(roket.aci)*24, y:roket.y - Math.cos(roket.aci)*24,

    sarsinti = Math.max(sarsinti, 5);
  }

  if (girdi.don) roket.aci += donusHizi()*girdi.don*dt;

  roket.itki = girdi.itki && yakit > 0;
  if (roket.itki) {
    const g = itkiGucu();
    roket.vx += Math.sin(roket.aci)*g*dt;
    roket.vy -= Math.cos(roket.aci)*g*dt;
    yakit = Math.max(0, yakit - tuketim()*dt);
    for (let i = 0; i < 2; i++)
      parcalar.push({ x:roket.x-Math.sin(roket.aci)*18, y:roket.y+Math.cos(roket.aci)*18,
        vx:-Math.sin(roket.aci)*150+(Math.random()-0.5)*70,
        vy: Math.cos(roket.aci)*150+(Math.random()-0.5)*70,
        omur:0.26+Math.random()*0.2, renk:"#fff" });
  }

  for (const p of gezegenler) {
    const dx = p.x-roket.x, dy = p.y-roket.y;
    const d2 = Math.max(dx*dx+dy*dy, 400), d = Math.sqrt(d2);
    const f = GRAV*p.m/d2;
    roket.vx += (dx/d)*f*dt; roket.vy += (dy/d)*f*dt;
  }
  for (const k of karaDelikler) {
    const dx = k.x-roket.x, dy = k.y-roket.y;
    const d2 = Math.max(dx*dx+dy*dy, 100), d = Math.sqrt(d2);
    const f = GRAV*k.m/d2;
    roket.vx += (dx/d)*f*dt; roket.vy += (dy/d)*f*dt;
    if (d < k.r + 6) {
      if (kalkan > 0) {   // kalkan: acil firlatma — roketi etki alani disina at
        kalkan--; const dr = Math.max(1, Math.hypot(dx,dy)), ux = -dx/dr, uy = -dy/dr;
        roket.x = k.x + ux*(k.etkiR+20); roket.y = k.y + uy*(k.etkiR+20);
        roket.vx = ux*220; roket.vy = uy*220;
        kalkanKir(roket.x, roket.y); break;
      }
      patlamaEfekti(roket.x, roket.y, 30, "#c77dff", 120); bitir(false, "KARA DELIK"); return;
    }
  }
  roket.x += roket.vx*dt; roket.y += roket.vy*dt;
  iz.push({ x:roket.x, y:roket.y });
  if (iz.length > 300) iz.shift();

  let enYakin = 1e9;
  for (const p of gezegenler) enYakin = Math.min(enYakin, Math.hypot(roket.x-p.x, roket.y-p.y)-p.r);
  roket.ayak += (((enYakin < 150) ? 1 : 0) - roket.ayak) * Math.min(1, dt*6);

  const h = hedefGez(), b = basGez();
  let uzaklik = Math.min(h ? Math.hypot(roket.x-h.x, roket.y-h.y) : 1e9,
                         b ? Math.hypot(roket.x-b.x, roket.y-b.y) : 1e9);
  for (const p of gezegenler) if (p.kurtarma)   // kurtarma duragi da capa sayilir
    uzaklik = Math.min(uzaklik, Math.hypot(roket.x-p.x, roket.y-p.y));
  if (uzaklik > 1750) { bitir(false, "UZAYA SAVRULDUN"); return; }

  for (const t of taslar) {
    const dx = t.x-roket.x, dy = t.y-roket.y;
    if (dx*dx+dy*dy < (t.r+11)*(t.r+11)) {
      if (kalkan > 0) { kalkan--; t.canli = false; kalkanKir(t.x, t.y); continue; }
      bitir(false, "GOKTASI"); return;
    }
  }

  for (const m of dusmanFuzeler) {   // UFO fuzesi
    const dx = m.x-roket.x, dy = m.y-roket.y;
    if (dx*dx+dy*dy < (12+11)*(12+11)) {
      if (kalkan > 0) { kalkan--; m.omur = 0; kalkanKir(m.x, m.y); continue; }
      bitir(false, "UFO FUZESI"); return;
    }
  }
  dusmanFuzeler = dusmanFuzeler.filter(m => m.omur > 0);

  for (const k of kapsuller) {
    if (!k.canli) continue;
    const dx = k.x-roket.x, dy = k.y-roket.y;
    if (dx*dx+dy*dy < (k.r+14)*(k.r+14)) {
      k.canli = false;
      if (k.tur === "yakit") { yakit = Math.min(kapasite(), yakit+25);
        patlamaEfekti(k.x, k.y, 18, "#7cf5c0", 90); }
      else { para += 40; patlamaEfekti(k.x, k.y, 18, "#f5d97c", 90); }
    }
  }
  kapsuller = kapsuller.filter(k => k.canli);

  for (const p of gezegenler) {
    const dx = roket.x-p.x, dy = roket.y-p.y, d = Math.hypot(dx,dy);
    if (d < p.r + AYAK_BOY) {
      const nx = dx/d, ny = dy/d;
      const hiz = Math.hypot(roket.vx-p.vx, roket.vy-p.vy);
      const nAci = Math.atan2(dx, -dy);
      const fark = Math.abs(((roket.aci-nAci+Math.PI*3)%(Math.PI*2))-Math.PI);

      if (p.hedef && hiz < inisHizi() && fark < inisAcisi()) {
        roket.x = p.x + nx*(p.r+AYAK_BOY);
        roket.y = p.y + ny*(p.r+AYAK_BOY);
        roket.vx = roket.vy = 0; roket.aci = nAci; roket.ayak = 1;
        sonInisId = p.id;
        bitir(true, "INIS BASARILI", { hiz, fark });
        return;
      }

      /* Kurtarma gezegeni: yuzeyde dur, duzgun konumdaysan mekige yakit aktar */
      if (p.kurtarma) {
        if (hiz >= inisHizi()*1.5) { bitir(false, "COK HIZLI"); return; }  // sert carpma = olum
        roket.x = p.x + nx*(p.r+AYAK_BOY);
        roket.y = p.y + ny*(p.r+AYAK_BOY);
        const vn = (roket.vx-p.vx)*nx + (roket.vy-p.vy)*ny;
        if (vn < 0) { roket.vx -= vn*nx; roket.vy -= vn*ny; }
        roket.vx += (p.vx-roket.vx)*0.25; roket.vy += (p.vy-roket.vy)*0.25;
        roket.ayak = 1;
        if (!p.mekik.gitti && hiz < inisHizi() && fark < inisAcisi()) {   // duzgun konum: aktar
          const ver = Math.min(30*dt, p.mekik.kap - p.mekik.yakit, Math.max(0, yakit - 15));
          yakit -= ver; p.mekik.yakit += ver;
          if (p.mekik.yakit >= p.mekik.kap - 0.4) mekikKurtar(p);
        }
        return;
      }

      /* Kalkis gezegeninde yumusak temas = yuzeyde durmak, carpma degil */
      if (p.baslangic && hiz < inisHizi()*1.5) {
        roket.x = p.x + nx*(p.r+AYAK_BOY);
        roket.y = p.y + ny*(p.r+AYAK_BOY);
        const vn = (roket.vx-p.vx)*nx + (roket.vy-p.vy)*ny;
        if (vn < 0) { roket.vx -= vn*nx; roket.vy -= vn*ny; }   // ice giren hizi sifirla
        roket.vx += (p.vx-roket.vx)*0.25;                        // yuzey surtunmesi
        roket.vy += (p.vy-roket.vy)*0.25;
        roket.ayak = 1;
        return;
      }

      let s = "SERT INIS";
      if (!p.hedef) s = p.baslangic ? "GERI DUSTUN" : "YANLIS GEZEGEN";
      else if (hiz >= inisHizi()) s = "COK HIZLI";
      else if (fark >= inisAcisi()) s = "EGIK INIS";
      bitir(false, s);
      return;
    }
  }
}

function bitir(basarili, metin, kalite) {
  if (durum !== "ucus") return;
  roket.canli = basarili;
  durum = basarili ? "indi" : "patladi";
  mesaj = metin;
  if (basarili) {
    const temel = 180 + etap*45;
    const sureBonus = Math.max(0, Math.round(90 - sure*3));
    // inis kalitesi: ne kadar yavas ve ne kadar dik inersen o kadar cok kredi
    const hizOran = kalite ? Math.max(0, 1 - kalite.hiz/inisHizi())  : 0;  // 0=sinirda, 1=tam durgun
    const aciOran = kalite ? Math.max(0, 1 - kalite.fark/inisAcisi()) : 0;  // 0=sinirda, 1=tam dik
    const yumusak = Math.round(hizOran * 150);
    const dik     = Math.round(aciOran * 120);
    const toplam = temel + yumusak + dik + sureBonus;
    sonKazanc = { temel, yumusak, dik, sureBonus, toplam,
                  hizYuzde: Math.round(hizOran*100), dikYuzde: Math.round(aciOran*100) };
    para += toplam;
  } else { patlamaEfekti(roket.x, roket.y, 42, "#fff", 250); sarsinti = 13; }
}

/* ===================== CIZIM ===================== */
function yildizlar() {
  const yari = { w: W/(2*kam.s), h: H/(2*kam.s) };
  const x1 = Math.floor((kam.x-yari.w)/260), x2 = Math.ceil((kam.x+yari.w)/260);
  const y1 = Math.floor((kam.y-yari.h)/260), y2 = Math.ceil((kam.y+yari.h)/260);
  ctx.fillStyle = "#2a2a2a"; ctx.shadowBlur = 0;
  const b = 1.8/kam.s;
  for (let i = x1; i <= x2; i++) for (let j = y1; j <= y2; j++) {
    for (let k = 0; k < 3; k++) {
      const s = Math.sin(i*127.1 + j*311.7 + k*74.7)*43758.5453;
      const s2 = Math.sin(i*269.5 + j*183.3 + k*45.1)*43758.5453;
      ctx.fillRect(i*260 + (s-Math.floor(s))*260, j*260 + (s2-Math.floor(s2))*260, b, b);
    }
  }
}

function roketCiz(x, y, aci, itkiVar, ayak) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(aci);
  ctx.shadowColor = "#fff"; ctx.shadowBlur = 11;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.7;
  if (ayak > 0.02) {
    ctx.save(); ctx.globalAlpha = Math.min(1, ayak*1.4); ctx.lineWidth = 1.5;
    for (const s of [-1,1]) {
      const a = ayak*0.62, bx = s*5, by = 9;
      const ex = bx+s*Math.sin(a)*15, ey = by+Math.cos(a)*15;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex-s*4, ey+1.5); ctx.lineTo(ex+s*4, ey+1.5); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,AYAK_BOY-1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-3.5,AYAK_BOY); ctx.lineTo(3.5,AYAK_BOY); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(6.5,-8); ctx.lineTo(-6.5,-8); ctx.closePath(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-6.5,-8); ctx.lineTo(-6.5,8); ctx.lineTo(-4.5,11);
  ctx.lineTo(4.5,11); ctx.lineTo(6.5,8); ctx.lineTo(6.5,-8); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-6.5,1); ctx.lineTo(6.5,1); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-3.5,2.8,0,6.2832); ctx.stroke();
  ctx.lineWidth = 1.6;
  for (const s of [-1,1]) { ctx.beginPath(); ctx.moveTo(s*6.5,1); ctx.lineTo(s*13,12); ctx.lineTo(s*6.5,10); ctx.stroke(); }
  if (itkiVar) {
    const u = 12+Math.random()*12;
    ctx.beginPath(); ctx.moveTo(-4,11); ctx.lineTo(0,11+u); ctx.lineTo(4,11); ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(-2,11); ctx.lineTo(0,11+u*0.55); ctx.lineTo(2,11); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function gezegenCiz(p) {
  const h = p.hedef, b = p.baslangic, kr = p.kurtarma;
  const renk = h ? "#7cf5c0" : (b ? "#8ad4ff" : (kr ? "#f5c44d" : "#fff"));
  ctx.shadowColor = renk; ctx.shadowBlur = h ? 16 : (kr ? 12 : 8);
  ctx.strokeStyle = renk; ctx.lineWidth = h ? 2.2 : 1.6;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineWidth = 1;
  ctx.strokeStyle = h ? "rgba(124,245,192,0.3)" : (b ? "rgba(138,212,255,0.28)" : (kr ? "rgba(245,196,77,0.3)" : "rgba(255,255,255,0.18)"));
  for (let k = 0; k < 20; k++) {
    const a = (k/20)*6.2832 + p.faz;
    ctx.beginPath();
    ctx.moveTo(p.x+Math.cos(a)*p.r, p.y+Math.sin(a)*p.r);
    ctx.lineTo(p.x+Math.cos(a)*(p.r-10-(k%3)*6), p.y+Math.sin(a)*(p.r-10-(k%3)*6));
    ctx.stroke();
  }
  for (const k of p.kraterler) {
    const cx = p.x+Math.cos(k.a)*p.r, cy = p.y+Math.sin(k.a)*p.r;
    ctx.save(); ctx.fillStyle = "#000"; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(cx, cy, k.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = renk; ctx.globalAlpha = 0.85; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, k.r, k.a+Math.PI*0.5, k.a+Math.PI*1.5); ctx.stroke();
    ctx.restore();
  }
  if (h) {
    const nb = (performance.now()/900)%1;
    ctx.shadowColor = "#7cf5c0"; ctx.shadowBlur = 10;
    ctx.strokeStyle = "rgba(124,245,192,0.5)"; ctx.globalAlpha = 1-nb;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+12+nb*26, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // kurtarma gezegeni: yuzeyde mahsur mekik (sana benzer) + yakit gostergesi
  if (kr && p.mekik && !p.mekik.gitti) {
    const a = p.mekik.aci;
    const sx = p.x+Math.cos(a)*p.r, sy = p.y+Math.sin(a)*p.r;
    const saci = Math.atan2(Math.cos(a), -Math.sin(a));
    roketCiz(sx, sy, saci, false, 0.5);
    const gx = p.x+Math.cos(a)*(p.r+34), gy = p.y+Math.sin(a)*(p.r+34);
    ctx.save(); ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(245,196,77,0.7)"; ctx.lineWidth = 1;
    ctx.strokeRect(gx-16, gy-3, 32, 6);
    ctx.fillStyle = "#f5c44d"; ctx.fillRect(gx-15, gy-2, 30*(p.mekik.yakit/p.mekik.kap), 4);
    ctx.restore();
  }
}

function karaDelikCiz(k) {
  const t = performance.now()/1000;
  // etki alani (soluk halka — tehlike bolgesini onceden belli eder)
  ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(199,125,255,0.10)"; ctx.lineWidth = 1/kam.s;
  ctx.beginPath(); ctx.arc(k.x, k.y, k.etkiR, 0, 6.2832); ctx.stroke();
  // yutucu disk — donen yaylar
  ctx.shadowColor = "#c77dff";
  for (let i = 0; i < 3; i++) {
    ctx.shadowBlur = 12;
    ctx.strokeStyle = `rgba(199,125,255,${0.55 - i*0.13})`;
    ctx.lineWidth = 2.4 - i*0.5;
    const a0 = t*(1.5 - i*0.35) + k.faz + i;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r + 10 + i*9, a0, a0 + 4.2); ctx.stroke();
  }
  // olay ufku
  ctx.shadowBlur = 18; ctx.shadowColor = "#c77dff"; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 6.2832); ctx.stroke();
  ctx.shadowBlur = 0;
}

function ufoCiz(u) {
  ctx.save(); ctx.translate(u.x, u.y);
  ctx.shadowColor = "#ff5c8a"; ctx.shadowBlur = 14;
  ctx.strokeStyle = "#ff5c8a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 2, 27, 9, 0, 0, 6.2832); ctx.stroke();   // govde
  ctx.beginPath(); ctx.arc(0, -1, 12, Math.PI, 0); ctx.stroke();            // kubbe
  ctx.beginPath(); ctx.moveTo(-27, 2); ctx.lineTo(27, 2); ctx.stroke();
  ctx.shadowBlur = 8; ctx.fillStyle = "#ff5c8a";                            // yanip sonen isiklar
  for (let i = -2; i <= 2; i++) {
    ctx.globalAlpha = Math.sin(u.faz + i*1.1) > 0 ? 1 : 0.25;
    ctx.beginPath(); ctx.arc(i*10, 8, 2.2, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function kapsulCiz(k) {
  const t = performance.now()/1000;
  const renk = k.tur === "yakit" ? "#7cf5c0" : "#f5d97c";
  const puls = 1 + Math.sin(t*3 + k.faz)*0.12;
  ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(t*0.8 + k.faz); ctx.scale(puls, puls);
  ctx.shadowColor = renk; ctx.shadowBlur = 12; ctx.strokeStyle = renk; ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i/6)*6.2832, x = Math.cos(a)*k.r, y = Math.sin(a)*k.r;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(k.x, k.y); ctx.shadowBlur = 0; ctx.fillStyle = renk;
  ctx.font = "700 12px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(k.tur === "yakit" ? "F" : "$", 0, 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.restore();
}

function kalkanCiz(x, y) {
  const t = performance.now()/1000;
  const puls = 0.6 + 0.4*Math.abs(Math.sin(t*2));
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = "#5cc8ff"; ctx.shadowBlur = 12;
  ctx.strokeStyle = `rgba(92,200,255,${(0.30+0.25*puls).toFixed(3)})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.2832); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = "#5cc8ff";   // her yuk icin donen bir yay
  for (let i = 0; i < kalkan; i++) {
    const a0 = t*0.8 + i*(6.2832/kalkan);
    ctx.beginPath(); ctx.arc(0, 0, 30, a0, a0 + 0.5); ctx.stroke();
  }
  ctx.restore();
}

/* Yaklasilan inilebilir gezegene gore hizalama — hem rehber hem HUD kullanir.
   Hedef ya da mekigi kurtulmamis kurtarma gezegeninden en yakini secilir. */
function hedefHizalama() {
  let en = null, enD = 1e9;
  for (const p of gezegenler) {
    if (!(p.hedef || (p.kurtarma && p.mekik && !p.mekik.gitti))) continue;
    const d = Math.hypot(roket.x-p.x, roket.y-p.y);
    if (d < enD) { enD = d; en = p; }
  }
  if (!en) return null;
  const dx = roket.x-en.x, dy = roket.y-en.y, d = Math.hypot(dx,dy) || 1;
  const nAci = Math.atan2(dx, -dy);
  const fark = Math.abs(((roket.aci-nAci+Math.PI*3)%(Math.PI*2))-Math.PI);
  const hiz = Math.hypot(roket.vx-en.vx, roket.vy-en.vy);
  return { h:en, d, nx:dx/d, ny:dy/d, nAci, fark, hiz, kurtarma:!!en.kurtarma,
           yaklasma: d-en.r, aciTamam: fark<inisAcisi(), hizTamam: hiz<inisHizi() };
}

/* Inis rehberi — hedefe yaklasinca dogru acyi ve durumu gosterir */
function inisRehberi() {
  const z = hedefHizalama();
  if (!z || z.yaklasma > 300) return;
  const sx = z.h.x + z.nx*z.h.r, sy = z.h.y + z.ny*z.h.r;   // yuzeydeki inis noktasi
  const renk = z.aciTamam ? (z.hizTamam ? "#7cf5c0" : "#f5d97c") : "#ff5c4d";
  const yog = Math.max(0.3, 1 - z.yaklasma/300);
  const uzun = 62;

  ctx.save();
  ctx.globalAlpha = yog; ctx.shadowColor = renk; ctx.shadowBlur = 8;
  // kabul konisi: iki sinir acisi (roket burnu bu aralikta olmali)
  ctx.strokeStyle = renk; ctx.lineWidth = 1.6/kam.s;
  for (const s of [-1, 1]) {
    const a = z.nAci + s*inisAcisi();
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.sin(a)*uzun, sy - Math.cos(a)*uzun); ctx.stroke();
  }
  // ideal "yukari" (yuzey normali) — kesikli orta cizgi
  ctx.setLineDash([5/kam.s, 5/kam.s]); ctx.lineWidth = 1.2/kam.s;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+z.nx*uzun, sy+z.ny*uzun); ctx.stroke();
  ctx.setLineDash([]);
  // roket etrafinda durum isigi
  ctx.shadowBlur = 14; ctx.lineWidth = 2.6/kam.s;
  ctx.beginPath(); ctx.arc(roket.x, roket.y, 27, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

function uyduCiz(x, y) {   // birakilmis kontrol noktasi
  const t = performance.now()/1000;
  ctx.save(); ctx.translate(x, y);
  ctx.shadowColor = "#8ad4ff"; ctx.shadowBlur = 10;
  ctx.strokeStyle = "#8ad4ff"; ctx.lineWidth = 1.6;
  ctx.strokeRect(-4, -4, 8, 8);                                  // govde
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(-13,0);          // paneller
  ctx.moveTo(4,0); ctx.lineTo(13,0); ctx.stroke();
  ctx.strokeRect(-19,-5, 6,10); ctx.strokeRect(13,-5, 6,10);
  const nb = (t*0.6)%1;                                          // atan halka
  ctx.globalAlpha = 1-nb; ctx.beginPath();
  ctx.arc(0, 0, 9+nb*22, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
}

function joystickCiz() {
  if (kolBagli) return;
  ctx.shadowBlur = 0;
  const aktif = joyId !== null;
  // dis halka
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  ctx.beginPath(); ctx.arc(JX, JY, JR, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = aktif ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.22)";
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(JX, JY, JR, 0, 6.2832); ctx.stroke();
  // sol/sag ipucu okları
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "18px ui-monospace, monospace";
  ctx.fillText("◀", JX-JR+16, JY); ctx.fillText("▶", JX+JR-16, JY);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  // ic topuz
  const kx = aktif ? joyPos.x : JX, ky = aktif ? joyPos.y : JY;
  ctx.fillStyle = aktif ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.13)";
  ctx.beginPath(); ctx.arc(kx, ky, JKNOB, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = aktif ? "rgba(255,255,255,0.75)" : "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(kx, ky, JKNOB, 0, 6.2832); ctx.stroke();
}

function ekranTuslariCiz() {
  if (kolBagli) return;
  joystickCiz();
  const basili = new Set();
  for (const [id, l] of isaretler) { if (id === joyId) continue; const t = tusBul(l); if (t) basili.add(t); }
  for (const t of TUSLAR) {
    const on = basili.has(t.id);
    const pasif = (t.id === "ates" && fuzeSayi <= 0) || (t.id === "uydu" && uyduSayi <= 0);
    ctx.shadowBlur = 0;
    ctx.fillStyle = on ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.05)";
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = pasif ? "rgba(255,255,255,0.1)" : (on ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.24)");
    ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = pasif ? "rgba(255,255,255,0.2)" : (on ? "#fff" : "rgba(255,255,255,0.6)");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = t.etiket.length > 2 ? "13px ui-monospace, monospace" : "20px ui-monospace, monospace";
    const etiket = t.id === "ates" ? `FUZE ${fuzeSayi}` : (t.id === "uydu" ? `UYDU ${uyduSayi}` : t.etiket);
    ctx.fillText(etiket, t.x, t.tus ? t.y-8 : t.y+1);   // tus varsa etiketi yukari al
    if (t.tus) {   // klavye tusunu butonun altina yaz (yonerge okumadan gorunsun)
      ctx.font = "11px ui-monospace, monospace";
      ctx.fillStyle = pasif ? "rgba(255,255,255,0.2)" : (on ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.45)");
      ctx.fillText(`(${t.tus})`, t.x, t.y+13);
    }
  }
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
}

function pusula() {
  const h = hedefGez();
  if (!h) return;
  const ex = W/2 + (h.x-kam.x)*kam.s, ey = H/2 + (h.y-kam.y)*kam.s;
  if (ex > 40 && ex < W-40 && ey > 40 && ey < H-40) return;
  const a = Math.atan2(ey-H/2, ex-W/2);
  const px = W/2 + Math.cos(a)*(W/2-60), py = H/2 + Math.sin(a)*(H/2-60);
  ctx.save(); ctx.translate(px, py); ctx.rotate(a);
  ctx.shadowColor = "#7cf5c0"; ctx.shadowBlur = 10;
  ctx.strokeStyle = "#7cf5c0"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-8,7); ctx.lineTo(-8,-7); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

function surumEtiketi() {
  ctx.shadowBlur = 0; ctx.font = "12px ui-monospace, monospace"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillText(`ROKET ${SURUM}`, 20, H-14);
}
function ciz() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  surumEtiketi();
  if (durum === "dukkan") { dukkanCiz(); return; }

  dunyaBasla();
  yildizlar();
  if (iz.length > 1) {
    ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 1/kam.s;
    ctx.beginPath(); ctx.moveTo(iz[0].x, iz[0].y);
    for (const p of iz) ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (const k of karaDelikler) karaDelikCiz(k);
  for (const p of gezegenler) gezegenCiz(p);
  for (const k of kapsuller) if (k.canli) kapsulCiz(k);

  ctx.shadowColor = "#ff5c4d"; ctx.shadowBlur = 10;
  ctx.strokeStyle = "#ff5c4d"; ctx.lineWidth = 1.6;
  for (const t of taslar) {
    ctx.beginPath();
    for (let k = 0; k < 9; k++) {
      const a = (k/9)*6.2832;
      const r = t.r*(0.76+0.24*Math.abs(Math.sin(k*2.3+t.faz)));
      const x = t.x+Math.cos(a)*r, y = t.y+Math.sin(a)*r;
      k ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }

  ctx.shadowColor = "#ff9a4d"; ctx.shadowBlur = 12;
  ctx.strokeStyle = "#ff9a4d"; ctx.lineWidth = 2;
  for (const m of fuzeler) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx));
    ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-6,3.5); ctx.lineTo(-6,-3.5); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }

  ctx.shadowColor = "#ff5c8a"; ctx.shadowBlur = 12;   // UFO fuzeleri (dusman)
  ctx.strokeStyle = "#ff5c8a"; ctx.lineWidth = 2;
  for (const m of dusmanFuzeler) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx));
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-6,4); ctx.lineTo(-6,-4); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  if (ufo) ufoCiz(ufo);

  ctx.shadowBlur = 5;
  for (const p of parcalar) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.omur*2));
    ctx.shadowColor = p.renk || "#fff"; ctx.fillStyle = p.renk || "#fff";
    ctx.fillRect(p.x-1.4, p.y-1.4, 2.8, 2.8);
  }
  ctx.globalAlpha = 1;
  for (const m of gidenMekikler) {   // kurtarilip uzaklasan mekik
    ctx.globalAlpha = Math.max(0, Math.min(1, m.omur/1.2));
    roketCiz(m.x, m.y, m.aci, true, 0);
  }
  ctx.globalAlpha = 1;
  if (uyduKonum) uyduCiz(uyduKonum.x, uyduKonum.y);
  if (durum === "ucus") inisRehberi();
  if ((roket.canli || durum === "indi") && kalkan > 0) kalkanCiz(roket.x, roket.y);
  if (roket.canli || durum === "indi") roketCiz(roket.x, roket.y, roket.aci, roket.itki, roket.ayak);
  dunyaBitir();

  pusula();
  arayuz();
  if (durum === "ucus" || durum === "hazir") ekranTuslariCiz();
}

function arayuz() {
  ctx.shadowBlur = 0;
  if (bildirim) {   // kurtarma gibi olaylar icin ortada gecici bildirim
    ctx.textAlign = "center"; ctx.font = "700 22px ui-monospace, monospace";
    ctx.globalAlpha = Math.max(0, Math.min(1, bildirim.omur*1.5));
    ctx.shadowColor = "#f5c44d"; ctx.shadowBlur = 14; ctx.fillStyle = "#f5c44d";
    ctx.fillText(bildirim.metin, W/2, 210);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = "left";
  }
  const hiz = Math.hypot(roket.vx, roket.vy);
  const h = hedefGez();
  ctx.font = "13px ui-monospace, monospace"; ctx.textAlign = "left";
  ctx.fillStyle = "#6a6a6a";
  ctx.fillText(`${etap}. SICRAMA`, 20, 30);
  ctx.fillText(`DENEME ${toplamDeneme}`, 20, 50);
  let yy = 74;
  altinCiz(20, yy, `${para} KREDI`, "13px ui-monospace, monospace"); yy += 22;
  ctx.font = "13px ui-monospace, monospace";
  if (seviye.fuze > 0)   { ctx.fillStyle = "#ff9a4d"; ctx.fillText(`FUZE ${fuzeSayi}/${fuzeKap()}`, 20, yy); yy += 22; }
  if (seviye.kalkan > 0) { ctx.fillStyle = "#5cc8ff"; ctx.fillText(`KALKAN ${kalkan}/${kalkanKap()}`, 20, yy); yy += 22; }
  if (uyduSayi > 0 || uyduKonum) {
    ctx.fillStyle = "#8ad4ff";
    ctx.fillText(`UYDU ${uyduSayi}` + (uyduKonum ? "  · NOKTA AKTIF" : ""), 20, yy); yy += 22;
  }
  if (h) {
    ctx.fillStyle = "#7cf5c0";
    ctx.fillText(`HEDEFE ${Math.round(Math.hypot(roket.x-h.x, roket.y-h.y) - h.r)} m`, 20, yy);
  }

  ctx.font = "13px ui-monospace, monospace"; ctx.textAlign = "left";
  ctx.fillStyle = "#6a6a6a"; ctx.fillText("YAKIT", W-200, 30);
  pilCiz(W-140, 19, 118, 13, yakit/kapasite(), yakit < kapasite()*0.25 ? "#ff5c4d" : "#7cf5c0");   // pil stili
  ctx.textAlign = "right"; ctx.fillStyle = "#5a5a5a"; ctx.font = "11px ui-monospace, monospace";
  ctx.fillText(`${yakit.toFixed(0)} / ${kapasite()}   -${tuketim().toFixed(0)}/sn`, W-20, 46);
  ctx.font = "13px ui-monospace, monospace";
  ctx.fillStyle = hiz < inisHizi() ? "#7cf5c0" : "#ff5c4d";
  ctx.fillText(`HIZ ${hiz.toFixed(0).padStart(3," ")} / ${inisHizi().toFixed(0)}`, W-20, 68);
  // hedefe yaklasinca aci (diklik) gostergesi
  if (durum === "ucus") {
    const z = hedefHizalama();
    if (z && z.yaklasma < 300) {
      ctx.textAlign = "right"; ctx.font = "13px ui-monospace, monospace";
      ctx.fillStyle = z.aciTamam ? "#7cf5c0" : "#ff5c4d";
      ctx.fillText(z.aciTamam ? "ACI ✓ DUZ" : "ACI ✗ EGIK", W-20, 90);
    }
  }
  ctx.textAlign = "left";

  if (durum === "hazir") {
    const s = ["Mavi gezegenden kalk, yesil gezegene in. Her inis bir sonrakinin kalkis noktasi.",
               "Dokunmatik: SOL joystick = don  ·  SAG buyuk tus = gaz  ·  etrafinda FUZE / UYDU",
               "Klavye: OK/A D = don  ·  W/Yukari = gaz  ·  X = fuze  ·  C = uydu  ·  Kol: A gaz, B fuze"];
    if (kapsuller.length)    s.push("Kapsulleri topla — F: +yakit, $: +kredi");
    if (karaDelikler.length) s.push("Kara delige dikkat: cekimi guclu, olay ufku olduruyor");
    if (gezegenler.some(g=>g.kurtarma)) s.push("Sari gezegende mahsur mekik var — duzgun in, yakit ver, kurtar, bol para al");
    if (etap >= 16)          s.push(`UFO tehlikesi: haritada belirir, ${ufoAtisSayisi()} fuze atar — kacin ya da fuzeyle vur (+150)`);
    if (uyduSayi > 0)        s.push("UYDU birak (C / ekran tusu): olursen oradan devam edersin");
    if (bedavaIkmal)         s.push("Acil yakit ikmali yapildi (45)");
    kutu(etap === 1 ? "YOLCULUK BASLIYOR" : `${etap}. SICRAMA — ${blokAdi()}`, s, "DOKUN / ENTER");
  } else if (durum === "patladi") {
    kutu(mesaj, [`Sure ${sure.toFixed(1)} sn`, uyduKayit ? "Birakilan uyduya donuluyor" : "Sicrama basina donuluyor"],
         "TEKRAR ICIN DOKUN", "#ff5c4d");
  } else if (durum === "indi") {
    kutu(mesaj, [
      `Sicrama odulu   ${sonKazanc.temel}`,
      `Yumusak inis    +${sonKazanc.yumusak}   (%${sonKazanc.hizYuzde} yavas)`,
      `Dik inis        +${sonKazanc.dik}   (%${sonKazanc.dikYuzde} dik)`,
      `Sure bonusu     +${sonKazanc.sureBonus}`,
      `TOPLAM          ${sonKazanc.toplam} KREDI`,
      `Kalan yakit     ${yakit.toFixed(0)}`
    ], "TERSANEYE GEC", "#7cf5c0");
  }
}

function kutu(baslik, satirlar, alt, renk) {
  renk = renk || "#fff";
  ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, H/2-130, W, 260);
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H/2-130); ctx.lineTo(W,H/2-130);
  ctx.moveTo(0,H/2+130); ctx.lineTo(W,H/2+130); ctx.stroke();
  ctx.textAlign = "center";
  ctx.shadowColor = renk; ctx.shadowBlur = 14; ctx.fillStyle = renk;
  ctx.font = "700 34px ui-monospace, monospace"; ctx.fillText(baslik, W/2, H/2-58);
  ctx.shadowBlur = 0;
  ctx.font = "13px ui-monospace, monospace"; ctx.fillStyle = "#9a9a9a";
  satirlar.forEach((s,i) => ctx.fillText(s, W/2, H/2-22+i*21));
  ctx.fillStyle = "#6a6a6a"; ctx.font = "12px ui-monospace, monospace";
  ctx.fillText(alt, W/2, H/2+104);
  // surum etiketi — modal kosesinde, kacirilmasi zor
  ctx.textAlign = "right"; ctx.font = "12px ui-monospace, monospace";
  ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillText(`ROKET ${SURUM}`, W-24, H/2+114);
  ctx.textAlign = "left";
}

function altinCiz(x, yb, metin, font) {   // altin coin + tutar (sol hizali)
  ctx.save(); ctx.shadowBlur = 0;
  const r = 6, cx = x+r, cy = yb-4;
  ctx.fillStyle = "#f5c44d"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = "rgba(120,90,30,0.9)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r-2.5, 0, 6.2832); ctx.stroke();
  ctx.font = font || "13px ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#f5d97c"; ctx.fillText(metin, x+2*r+6, yb);
  ctx.restore();
}
function pilCiz(x, y, w, h, oran, renk) {   // yatay pil/yakit bari (sagda ucu)
  ctx.save(); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fillRect(x+w+1.5, y+h*0.28, 3, h*0.44);   // pil ucu
  ctx.fillStyle = renk; ctx.fillRect(x+1.5, y+1.5, Math.max(0, w-3)*Math.max(0, Math.min(1, oran)), h-3);
  ctx.restore();
}

function dukkanCiz() {
  ctx.textAlign = "center";
  ctx.shadowColor = "#f5d97c"; ctx.shadowBlur = 16; ctx.fillStyle = "#f5d97c";
  ctx.font = "700 34px ui-monospace, monospace"; ctx.fillText("TERSANE", W/2, 96);
  ctx.shadowBlur = 0;
  ctx.font = "12px ui-monospace, monospace"; ctx.fillStyle = "rgba(245,217,124,0.6)";
  ctx.fillText(`ROKET ${SURUM}`, W/2, 58);

  // ust bilgi seridi: altin (coin) + yakit pili + fuze
  const yb = 138;
  altinCiz(W/2 - 280, yb, `${para} KREDI`, "16px ui-monospace, monospace");
  ctx.textAlign = "left"; ctx.font = "14px ui-monospace, monospace"; ctx.fillStyle = "#8a8a8a";
  ctx.fillText("YAKIT", W/2 - 40, yb);
  pilCiz(W/2 + 24, yb-13, 130, 15, yakit/kapasite(), yakit < kapasite()*0.25 ? "#ff5c4d" : "#7cf5c0");
  ctx.fillStyle = "#cfcfcf"; ctx.fillText(`${yakit.toFixed(0)}/${kapasite()}`, W/2 + 164, yb);
  if (seviye.fuze) { ctx.fillStyle = "#ff9a4d"; ctx.fillText(`FUZE ${fuzeSayi}/${fuzeKap()}`, W/2 + 270, yb); }

  ctx.textAlign = "center"; ctx.font = "12px ui-monospace, monospace"; ctx.fillStyle = "#6a6a6a";
  ctx.fillText("Yukari/Asagi sec · Enter veya A ile al · dokunmatikte satira dokun", W/2, 168);

  const rows = dukkanSatirlari(), n = rows.length;
  ctx.textAlign = "left";
  for (let idx = 0; idx < n; idx++) {
    const row = rows[idx], y = dukkanY(idx, n), secili = dukkanSecim === idx;
    if (row.tur === "devam") {
      if (secili) { ctx.fillStyle = "rgba(124,245,192,0.1)"; ctx.fillRect(200, y-24, 800, 48);
        ctx.strokeStyle = "rgba(124,245,192,0.5)"; ctx.lineWidth = 1; ctx.strokeRect(200, y-24, 800, 48); }
      ctx.textAlign = "center"; ctx.font = "17px ui-monospace, monospace"; ctx.fillStyle = "#7cf5c0";
      ctx.fillText(`${etap+1}. SICRAMAYA DEVAM`, W/2, y+5); ctx.textAlign = "left"; continue;
    }
    let ad, ack, fiyatMetni, alinabilir, doluMu = false, lv = 0, mx = 0, sarfMi = false;
    if (row.tur === "yuk") {
      const u = YUKSELTMELER[row.i]; lv = seviye[u.id]; mx = u.max; doluMu = lv >= mx;
      ad = u.ad; ack = u.aciklama;
      const f = doluMu ? 0 : u.fiyat(lv);
      fiyatMetni = doluMu ? "TAM" : `${f}`; alinabilir = !doluMu && para >= f;
    } else {
      const s = SARFLAR[row.i]; sarfMi = true;
      ad = s.ad; ack = s.aciklama;
      const uygun = s.uygun(), f = s.fiyat();
      fiyatMetni = uygun ? `${f}` : "GEREK YOK"; alinabilir = uygun && para >= f; doluMu = !uygun;
    }
    if (secili) {
      const rk = sarfMi ? "124,245,192" : "245,217,124";
      ctx.fillStyle = `rgba(${rk},0.08)`; ctx.fillRect(200, y-24, 800, 48);
      ctx.strokeStyle = `rgba(${rk},0.5)`; ctx.lineWidth = 1; ctx.strokeRect(200, y-24, 800, 48);
    }
    ctx.font = "16px ui-monospace, monospace";
    ctx.fillStyle = doluMu ? "#4a4a4a" : (alinabilir ? "#fff" : "#6a6a6a");
    ctx.fillText(ad, 224, y-2);
    ctx.font = "12px ui-monospace, monospace"; ctx.fillStyle = "#6a6a6a";
    ctx.fillText(ack, 224, y+16);
    // yukseltme pip'leri (10'a kadar sigar)
    if (mx) {
      const ps = Math.min(18, 176/mx), pw = Math.min(12, ps-3);
      for (let k = 0; k < mx; k++) { ctx.fillStyle = k < lv ? "#7cf5c0" : "#2e2e2e";
        ctx.fillRect(686+k*ps, y-11, pw, 11); }
    }
    // yakit ikmali satirinda dolan yakit bari (sayi da var)
    if (sarfMi && SARFLAR[row.i].ad === "YAKIT IKMALI") {
      pilCiz(686, y-11, 150, 13, yakit/kapasite(), yakit < kapasite()*0.25 ? "#ff5c4d" : "#7cf5c0");
      ctx.textAlign = "left"; ctx.font = "11px ui-monospace, monospace"; ctx.fillStyle = "#8a8a8a";
      ctx.fillText(`${yakit.toFixed(0)}/${kapasite()}`, 686, y+16);
    }
    ctx.textAlign = "right"; ctx.font = "15px ui-monospace, monospace";
    ctx.fillStyle = doluMu ? "#4a4a4a" : (alinabilir ? "#f5d97c" : "#5a4a2a");
    ctx.fillText(fiyatMetni, 976, y+4);
    ctx.textAlign = "left";
  }
}

/* ===================== DONGU ===================== */
let sonZaman = performance.now();
function dongu(t) {
  let dt = (t-sonZaman)/1000; sonZaman = t;
  if (dt > 0.05) dt = 0.05;
  guncelle(dt);
  kameraGuncelle(dt);
  ciz();
  requestAnimationFrame(dongu);
}
resize(); yenidenBasla(); requestAnimationFrame(dongu);
</script>
